<!DOCTYPE html>
<html>
<head>
    <title>ADMIN KEY - MENU VIP</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: #111111;
            border: 1px solid #ffd700;
            border-radius: 10px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .sub {
            color: #888;
            font-size: 12px;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 12px;
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            width: 95%;
            padding: 12px;
            background: #ffd700;
            color: black;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        #currentKey {
            color: #ffd700;
            font-size: 16px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔑 MENU VIP</h1>
        <p class="sub">ADMIN - Đổi key 24h</p>

        <div id="currentKey">Đang tải key...</div>

        <input type="text" id="newKey" placeholder="Nhập key mới..." />
        <button onclick="changeKey()">ĐỔI KEY NGAY</button>

        <p id="status"></p>
    </div>

    <script>
        const BIN_ID = "YOUR_BIN_ID";
        const MASTER_KEY = "YOUR_MASTER_KEY";

        async function loadCurrentKey() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                document.getElementById('currentKey').innerHTML = 
                    'KEY HIỆN TẠI: ' + data.record.key;
            } catch (e) {
                document.getElementById('currentKey').innerHTML = 
                    'Lỗi kết nối JSONBin!';
            }
        }

        async function changeKey() {
            const newKey = document.getElementById('newKey').value.trim();
            if (!newKey) {
                alert('Nhập key mới!');
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ key: newKey })
                });

                if (res.ok) {
                    document.getElementById('status').innerHTML = 
                        '✅ Key đã đổi: ' + newKey;
                    document.getElementById('currentKey').innerHTML = 
                        'KEY HIỆN TẠI: ' + newKey;
                } else {
                    document.getElementById('status').innerHTML = 
                        '❌ Lỗi đổi key!';
                }
            } catch (e) {
                document.getElementById('status').innerHTML = 
                    '❌ Lỗi kết nối!';
            }
        }

        loadCurrentKey();
    </script>
</body>
</html>
